management:
  health:
    mail:
      enabled: false
    redis:
      enabled: true

spring:
  application:
    name: internship
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  jndi:
    rmi:
      remote:
        object:
          read-timeout: 0
  netty:
    leak-detection:
      level: DISABLED
    allocator:
      type: unpooled
    transport:
      noNative: true
  server:
    tomcat:
      connection-timeout: 60000
      max-connections: 10000
      threads:
        max: 500
    response-timeout: 300000
  mvc:
    async:
      request-timeout: 300000

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:internship}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 30000
      connection-timeout: 10000
      auto-commit: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
        shutdown-timeout: 200ms
        cluster:
          refresh:
            adaptive: true
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
  mail:
    host: smtp.exmail.qq.com
    port: 465
    username: luzujian@deepintern.wecom.work
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          localhost: deepintern.wecom.work
    default-encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
      accept-single-value-as-array: true
    parser:
      allow-unquoted-control-chars: true
      allow-backslash-escaping-any-character: true
    mapper:
      accept-case-insensitive-properties: true
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.1
          max-tokens: 2000
  http:
    client:
      connect-timeout: 30000
      read-timeout: 300000
      pool:
        max-idle-time: 60000
        max-life-time: 900000
      ssl:
        verify: false

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    url-prefix: /uploads
    max-size: ${FILE_MAX_SIZE:10485760}

internship:
  appraisal:
    max-size: ${INTERNSHIP_APPRAISAL_MAX_SIZE:20971520}

# 审计可信反向代理列表（逗号分隔，支持精确 IP 与 IPv4 CIDR，如 172.18.0.5,172.18.0.0/16）。
# 仅当连接来源命中该列表时才信任 X-Forwarded-For 等转发头；留空则审计 IP 一律取连接来源 IP。
audit:
  trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
  # P2 哈希链签名密钥（建议通过服务器 .env 配置随机密钥；留空则首次自动生成并存入 system_config）
  hash:
    key: ${AUDIT_HASH_KEY:}

backup:
  path: ${BACKUP_PATH:./backups}
  tls:
    ca: ${BACKUP_TLS_CA:}
  retention:
    days: ${BACKUP_RETENTION_DAYS:30}
  compress: false
  format: SQL
  storage:
    type: ${BACKUP_STORAGE_TYPE:LOCAL}
    oss:
      enabled: true

sms:
  enabled: true
  debug: true
  access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  sign-name: ${SMS_SIGN_NAME:速通互联验证码}
  template-code: ${SMS_TEMPLATE_CODE:100001}
  scheme-name: ${SMS_SCHEME_NAME:默认方案}
  code-length: 6
  valid-time: 300

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  check-config-location: false
  mapper-locations: classpath:com/internship/mapper/*.xml,classpath:mapper/*.xml

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql;pageNum=page;pageSize=pageSize;

logging:
  level:
    root: INFO
    com.internship: INFO
    org.springframework.ai: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.jdbc.support.JdbcTransactionManager: INFO
    com.github.pagehelper: INFO
    com.github.pagehelper.page: INFO

# LangGraph owns the sidebar agent loop; application tools retain role and write authorization.
agent:
  enabled: ${AGENT_ENABLED:system}
  model: ${AGENT_MODEL:deepseek-flash}
  harness: ${AGENT_HARNESS:langgraph}
  langgraph:
    url: ${AGENT_LANGGRAPH_URL:http://127.0.0.1:8791}
    service-key: ${AGENT_LANGGRAPH_SERVICE_KEY:}
  bridge:
    bind-address: ${AGENT_BRIDGE_BIND_ADDRESS:127.0.0.1}
    tool-port: ${AGENT_TOOL_PORT:0}
    model-port: ${AGENT_MODEL_PORT:0}
    tool-url: ${AGENT_TOOL_URL:}
    model-url: ${AGENT_MODEL_URL:}
  opencode:
    executable: ${AGENT_OPENCODE_EXECUTABLE:opencode}
    node: ${AGENT_OPENCODE_NODE:node}
    version: ${AGENT_OPENCODE_VERSION:1.18.35}
    work-dir: ${AGENT_OPENCODE_WORK_DIR:uploads/agent-runtime}
    max-sessions: ${AGENT_OPENCODE_MAX_SESSIONS:4}
    idle-timeout-ms: ${AGENT_OPENCODE_IDLE_TIMEOUT_MS:1800000}

teacher:
  auto-task:
    cron: ${TEACHER_AUTO_TASK_CRON:0 * * * * ?}
    zone: ${TEACHER_AUTO_TASK_ZONE:Asia/Shanghai}
    missed-grace-minutes: ${TEACHER_AUTO_TASK_MISSED_GRACE_MINUTES:60}
    test-mode: ${TEACHER_AUTO_TASK_TEST_MODE:false}
    recipient-allowlist: ${TEACHER_AUTO_TASK_RECIPIENT_ALLOWLIST:}

jwt:
  secret: ${JWT_SECRET:DevOnlyJwtSecret2025DeepInternLocalDev!NotForProduction!!}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  enabled: true

announcement:
  attachments:
    legacy-manifest: ${ANNOUNCEMENT_ATTACHMENT_LEGACY_MANIFEST:}
    signing-key: ${ANNOUNCEMENT_ATTACHMENT_SIGNING_KEY:}
    previous-signing-keys: ${ANNOUNCEMENT_ATTACHMENT_PREVIOUS_SIGNING_KEYS:}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:your_bucket_name}
    region: ${ALIYUN_OSS_REGION:cn-beijing}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}

server:
  servlet:
    session:
      timeout: 30m
  response-timeout: 60000
  tomcat:
    relaxed-path-chars: "|"
    relaxed-query-chars: "|"
